# Render Blueprint: бесплатный хостинг веб-приложения.
# Инструкция: docs/guides/05_Хостинг_Render.md
services:
  - type: web
    name: password-check
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # $PORT задаёт Render; 0.0.0.0 — принимать запросы снаружи контейнера
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
